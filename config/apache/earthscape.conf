# PREPARED, NOT INSTALLED, NOT TESTED: Apache HTTP Server is not present on this machine.
# Purpose: terminate TLS in front of the EarthScape app (uvicorn on 127.0.0.1:8000) so browser traffic is encrypted.
# Include this file from httpd.conf (Apache 2.4 for Windows, e.g. Apache Lounge build, with OpenSSL).
#
# Certificate requirements (docs/security-and-reliability.md):
#   * local demo: a self-signed certificate whose subject alternative name matches the host name used in the browser
#       openssl req -x509 -newkey rsa:3072 -nodes -keyout earthscape.key -out earthscape.crt -days 365 \
#         -subj "/CN=earthscape.local" -addext "subjectAltName=DNS:earthscape.local,IP:127.0.0.1"
#     (browsers warn until the .crt is trusted on that machine; add "127.0.0.1 earthscape.local" to the hosts file)
#   * any real deployment: a certificate from a CA the clients trust (e.g. Let's Encrypt) for the real host name
#   * keep the .key outside the project and the ZIP (the ZIP script already excludes *.key / *.pem); readable only by the service account
# After enabling, start the app with COOKIE_SECURE=1 so session cookies are sent only over HTTPS, and never expose port 8000.

LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so

# Loopback only: no public exposure unless this is changed on purpose.
Listen 127.0.0.1:443
Listen 127.0.0.1:80

SSLProtocol             -all +TLSv1.2 +TLSv1.3
SSLCipherSuite          ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
SSLHonorCipherOrder     off
SSLSessionTickets       off
SSLSessionCache         "shmcb:logs/ssl_scache(512000)"

<VirtualHost 127.0.0.1:443>
    ServerName earthscape.local
    SSLEngine on
    SSLCertificateFile    "C:/certs/earthscape.crt"
    SSLCertificateKeyFile "C:/certs/earthscape.key"

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto "https"
    # HSTS: enable only once the certificate is trusted, otherwise a browser can lock itself out
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>

<VirtualHost 127.0.0.1:80>
    ServerName earthscape.local
    RewriteEngine on
    RewriteRule ^ https://earthscape.local%{REQUEST_URI} [R=301,L]
</VirtualHost>
