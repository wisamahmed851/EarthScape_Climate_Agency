# TLS reverse proxy for EarthScape (prepared, not installed or tested). Certificate steps: docs/security-and-reliability.md

LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so

Listen 127.0.0.1:443
Listen 127.0.0.1:80

SSLProtocol             -all +TLSv1.2 +TLSv1.3
SSLCipherSuite          ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
SSLHonorCipherOrder     off
SSLSessionTickets       off
SSLSessionCache         "shmcb:logs/ssl_scache(512000)"

<VirtualHost 127.0.0.1:443>
    ServerName earthscape.local
    SSLEngine on
    SSLCertificateFile    "C:/certs/earthscape.crt"
    SSLCertificateKeyFile "C:/certs/earthscape.key"

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>

<VirtualHost 127.0.0.1:80>
    ServerName earthscape.local
    RewriteEngine on
    RewriteRule ^ https://earthscape.local%{REQUEST_URI} [R=301,L]
</VirtualHost>
